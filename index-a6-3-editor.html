<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Титульная сторона свадебного приглашения Марии и Александра. 6 февраля 2027 года. Формат A6.">
  <title>Мария и Александр — обложка A6 · редактор фото</title>
  <link rel="stylesheet" href="styles-a6-3.css">
  <link rel="stylesheet" href="image-editor.css">
  <script src="image-editor.js" defer></script>
</head>
<body class="image-editor" data-editor-page="a6-cover">
<div class="editor-layout">
<aside class="editor-panel editor-images" aria-labelledby="images-title"><h2 id="images-title">Изображения</h2><p class="editor-hint">X и Y — сдвиг в % от размера рамки. Масштаб — в %. Выбор другого фото сбрасывает его настройки.</p><div id="image-controls"></div></aside>
  <main class="cover" aria-labelledby="names">
    <span class="image-frame image-frame-cover"><img class="cover-photo" data-image-id="cover" data-image-label="Фото обложки" src="assets/images/couple.jpg" width="493" height="622" alt="Жених нежно целует невесту в лоб, сидя рядом с ней на светлых ступенях" fetchpriority="high"></span>
    <div class="cover-content">
      <div class="signature">
        <h1 id="names"><span>Мария</span><span class="second-name"><em>и</em> Александр</span></h1>
        <div class="date-rule" aria-hidden="true"></div>
        <time datetime="2027-02-06">6 февраля 2027</time>
      </div>
    </div>
  </main>
<aside class="editor-panel editor-actions" aria-labelledby="actions-title"><h2 id="actions-title">Настройки</h2><button type="button" id="reset-images">Сбросить всё</button><button type="button" id="export-images">Экспорт JSON</button><button type="button" id="import-images">Загрузить JSON</button><input type="file" id="import-file" accept=".json,application/json" hidden><p class="editor-hint">Сохраните JSON, чтобы позже восстановить изображения и кадрирование. При печати панели скрыты.</p><p id="editor-status" role="status" aria-live="polite"></p></aside>
</div>
</body>
</html>
